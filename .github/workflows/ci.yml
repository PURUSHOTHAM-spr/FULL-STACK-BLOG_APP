name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-only-secret
      DB_URL: mongodb://127.0.0.1:27017/ci-test-unused
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Validate Docker builds
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag secure-blog-backend:ci backend

      - name: Build frontend image
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg VITE_API_BASE_URL=http://127.0.0.1:4000
          --tag secure-blog-frontend:ci
          frontend
